plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
loom {
    splitEnvironmentSourceSets()
    mods { "annawathe" { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
repositories {
    maven { name = "Ladysnake Mods"; url = 'https://maven.ladysnake.org/releases' }
    maven { name = "Xander Maven"; url = 'https://maven.isxander.dev/releases' }
    maven { name = "Modrinth"; url = 'https://api.modrinth.com/maven' }
    maven { name = "Datasync"; url = 'https://maven.uuid.gg/releases' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modApi files("libs/wathe-${project.wathe_version}.jar")
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-scoreboard:${project.cca_version}"
    // 原版 Wathe 的运行时代码直接引用 Ratatouille；开发启动也必须把它放入运行类路径。
    modImplementation "dev.doctor4t:ratatouille:${project.ratatouille_version}"
    // libs 中的开发版 Wathe jar 未内嵌 MidnightLib，runClient 需要显式补入；不打进 AnnaWathe 产物。
    modRuntimeOnly "maven.modrinth:midnightlib:${project.midnightlib_version}"
}
processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") { expand version: project.version, minecraft_version: project.minecraft_version, loader_version: project.loader_version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8"; options.release.set(21) }
java { withSourcesJar() }
jar { from("LICENSE") { rename { "${it}_${project.archives_base_name}" } } }
